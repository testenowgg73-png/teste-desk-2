plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shadowx.desk'
    compileSdk 34

    defaultConfig {
        applicationId "com.shadowx.desk"
        minSdk 17
        targetSdk 19
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
