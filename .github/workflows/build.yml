name: Build ShadowX Desk

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Compilar APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowXDesk-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar EXE
        working-directory: pc
        run: |
          python -m pip install pillow pyautogui pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name ShadowXDesk shadowx_desk.py
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowXDesk-EXE
          path: pc/dist/ShadowXDesk.exe
